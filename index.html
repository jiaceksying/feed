<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>童心日记 — 儿童成长记录</title>
  <meta name="description" content="记录孩子的每一天，见证成长的每一步。支持图文记录、成长曲线、多格式导出。">
  <meta name="theme-color" content="#FF6B9D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="童心日记">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- 顶部导航 -->
    <nav class="navbar">
      <div class="nav-inner">
        <div class="nav-brand" onclick="App.switchTab('timeline')">
          <span class="nav-logo">🌈</span>
          <div class="nav-title-group">
            <span class="nav-title">童心日记</span>
            <span class="nav-sub" id="navChildName">还未设置宝贝信息</span>
          </div>
        </div>
        <div class="nav-tabs">
          <button class="tab-btn active" data-tab="timeline" onclick="App.switchTab('timeline')">
            <span class="tab-icon">📖</span>记录
          </button>
          <button class="tab-btn" data-tab="add" onclick="App.switchTab('add')">
            <span class="tab-icon">✏️</span>添加
          </button>
          <button class="tab-btn" data-tab="growth" onclick="App.switchTab('growth')">
            <span class="tab-icon">📊</span>成长
          </button>
          <button class="tab-btn" data-tab="settings" onclick="App.switchTab('settings')">
            <span class="tab-icon">⚙️</span>设置
          </button>
        </div>
      </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content" id="mainContent">
      <!-- 内容由 JS 动态渲染 -->
    </main>

    <!-- 底部 -->
    <footer class="footer">
      <p>童心日记 · 用爱记录成长的每一天 💝</p>
    </footer>
  </div>

  <!-- 弹窗容器 -->
  <div id="modalContainer"></div>

  <!-- Toast 通知 -->
  <div id="toastContainer" class="toast-container"></div>

  <script src="js/database.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/export.js"></script>
  <script src="js/app.js"></script>
  <script>App.init();</script>
</body>
</html>
